<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fit Log</title>
<meta name="theme-color" content="#f7f3ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fit Log">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><svg class="eyes" viewBox="0 0 34 24" aria-hidden="true"><ellipse cx="10" cy="12" rx="9" ry="11" fill="var(--ink)" stroke="none"/><ellipse cx="24" cy="12" rx="9" ry="11" fill="var(--ink)" stroke="none"/><ellipse cx="12" cy="13" rx="3" ry="4" fill="var(--bg)" stroke="none"/><ellipse cx="26" cy="13" rx="3" ry="4" fill="var(--bg)" stroke="none"/></svg><h1 id="title">Today</h1></div>
  <button class="icon-btn" data-act="go" data-arg="settings" aria-label="Settings">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
</header>
<main id="view"></main>
<div id="timer" class="timer" hidden></div>
<nav class="tabbar">
  <button data-act="go" data-arg="today"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg><span>Today</span></button>
  <button data-act="go" data-arg="food"><svg viewBox="0 0 24 24"><path d="M7 2v9a2 2 0 0 1-2 2v9M3 2v6a4 4 0 0 0 4 4M11 2v6a4 4 0 0 1-4 4M17 22V2c2.8 1.5 4 4.5 4 9h-4"/></svg><span>Food</span></button>
  <button data-act="go" data-arg="train"><svg viewBox="0 0 24 24"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg><span>Train</span></button>
  <button data-act="go" data-arg="meals"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg><span>Meals</span></button>
  <button data-act="go" data-arg="body"><svg viewBox="0 0 24 24"><path d="M3 17l5-5 4 4 8-9"/><path d="M15 7h5v5"/></svg><span>Body</span></button>
  <button data-act="go" data-arg="health"><svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"/><path d="M3.5 12h4l2-3 3 6 2-3h6"/></svg><span>Health</span></button>
</nav>
<div id="modal" class="modal" hidden><div class="sheet" id="sheet"></div></div>
<div id="toast" class="toast" hidden></div>
<script src="js/core.js"></script>
<script src="js/ai.js"></script>
<script src="js/today.js"></script>
<script src="js/food.js"></script>
<script src="js/train.js"></script>
<script src="js/week.js"></script>
<script src="js/meals.js"></script>
<script src="js/body.js"></script>
<script src="js/health.js"></script>
<script src="js/settings.js"></script>
<script src="js/main.js"></script>
</body>
</html>
